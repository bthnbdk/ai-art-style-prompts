[build]
  publish = "."

# Long cache for the immutable sample images
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/data/styles.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
